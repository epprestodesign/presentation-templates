# Netlify build config, mirroring the pattern in eventpipe-prototype-ds so both
# design systems deploy the same way.
#
# Tokens are generated ahead of the Storybook build. src/styles/theme.css IS
# committed, so this is belt-and-braces — but it means a token edit that someone
# forgot to regenerate still ships correctly rather than deploying stale CSS.

[build]
  command = "pnpm build:tokens && pnpm build-storybook"
  publish = "storybook-static"

[build.environment]
  NODE_VERSION = "24"
  STORYBOOK_DISABLE_TELEMETRY = "1"

# No secrets are needed to build this site. UNSPLASH_ACCESS_KEY is only used by
# `pnpm imagery:fetch`, which is run locally — the downloaded images are
# committed, so the build never calls the API. Deliberately not exposed to CI.

# Storybook is a single-page app: deep links like /?path=/story/... resolve at the
# root, but a direct hit on an unknown path should still serve the app shell
# rather than a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
